[project]
name = "prompt-to-video"
version = "1.0.0"
description = "Prompt-to-video generation pipeline for scripts, images, narration, subtitles, and rendered videos"
authors = [
  { name = "Marius Arlauskas" },
  { name = "Tomas Timinskas" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate>=1.0.1,<2.0.0",
  "diffusers>=0.31.0,<0.32.0",
  "edge-tts @ git+https://github.com/rany2/edge-tts.git",
  "ffmpeg>=1.4,<2.0",
  "ffmpeg-python>=0.2.0,<0.3.0",
  "ipywidgets>=8.1.5,<9.0.0",
  "jupyter>=1.1.1,<2.0.0",
  "mosaico>=0.4.0,<0.5.0",
  "mutagen>=1.47.0,<2.0.0",
  "openai>=1.54.3,<2.0.0",
  "pillow>=9.2.0,<11.0.0",
  "protobuf>=5.28.3,<6.0.0",
  "pydantic>=2.9.2,<3.0.0",
  "pydub>=0.25.1,<0.26.0",
  "pysrt>=1.1.2,<2.0.0",
  "safetensors>=0.4.5,<0.5.0",
  "sentencepiece>=0.2.0,<0.3.0",
  "srt>=3.5.3,<4.0.0",
  "streamlit>=1.40.0,<2.0.0",
  "torch>=2.5.1,<3.0.0",
  "torchaudio>=2.6.0,<3.0.0",
  "transformers>=4.46.0,<5.0.0",
  "whisper>=1.1.10,<2.0.0",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29.5,<7.0.0",
  "isort>=6.0.0,<7.0.0",
  "pickleshare>=0.7.5,<0.8.0",
  "pre-commit>=4.0.0,<5.0.0",
  "pytest>=8.3.4,<9.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "ruff>=0.9.5,<0.10.0",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_to_video"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN002",  # Missing type annotation for args
  "ANN003",  # Missing type annotation for kwarg
  "ANN401",  # Dynamic type annotations
  "C901",    # Complex functions are acceptable for small Streamlit callbacks
  "COM812",  # Missing trailing comma
  "D102",    # Missing docstring in public method
  "D105",    # Missing docstring in magic method
  "D107",    # Missing docstring in __init__
  "D100",    # Missing docstring in public module
  "D101",    # Missing docstring in public class (for obvious classes)
  "D103",    # Missing docstring in public function (for obvious functions)
  "D104",    # Missing docstring in public package
  "E501",    # Long prompt strings are more readable unwrapped
  "FBT001",  # Bool use in arg
  "FBT002",  # Default bool use in arg
  "G004",    # Logging with f-strings
  "INP001",  # Missing __init__.py in package
  "PLR0913", # Too many arguments (ignored if default args are used)
  "S101",    # Use of assert
  "S108",    # Configurable temp paths may default to /tmp
  "S603",    # subprocess is used with shell=False for Real-ESRGAN
  "SLF001",  # Access to a private member (for tests only)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
